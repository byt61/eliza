# This manual workflow is the single credential-backed product smoke entry
# point. Live integrations do not run on pull requests or on an unattended
# schedule, so missing credentials cannot make normal repository health red.
name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live surface to exercise
        required: true
        default: all
        type: choice
        options: [all, app, scenarios, cloud, voice]

concurrency:
  # The shared smoke credential must remain attached to an empty organization.
  # Serialize every manual live suite so an `all` and `cloud` dispatch cannot
  # race between the read-only preflight and fresh create.
  group: live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY }}
      ELIZAOS_CLOUD_BASE_URL: ${{ vars.ELIZAOS_CLOUD_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Chromium
        if: inputs.suite == 'all' || inputs.suite == 'app'
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: App walkthrough
        if: inputs.suite == 'all' || inputs.suite == 'app'
        run: bun run --cwd packages/app test:e2e:walkthrough:live

      - name: Live scenarios
        if: inputs.suite == 'all' || inputs.suite == 'scenarios'
        run: bun run --cwd packages/scenario-runner test:live:e2e

      - name: Cloud end-to-end
        if: inputs.suite == 'all' || inputs.suite == 'cloud'
        run: bun run test:cloud:e2e

      - name: Voice service
        if: inputs.suite == 'all' || inputs.suite == 'voice'
        run: bun run --cwd packages/scenario-runner test:real-service:voice

      - name: Railway voice contract
        if: inputs.suite == 'all' || inputs.suite == 'voice'
        env:
          ELIZA_VOICE_LIVE_RAILWAY: "1"
          KOKORO_TTS_URL: ${{ vars.ELIZA_VOICE_KOKORO_TTS_URL }}
          WHISPER_STT_URL: ${{ vars.ELIZA_VOICE_WHISPER_STT_URL }}
          WHISPER_STT_MODEL: ${{ vars.ELIZA_VOICE_WHISPER_STT_MODEL }}
        run: bun test packages/cloud/api/__tests__/voice-kokoro-whisper-live.test.ts

  shared-staging-onboarding:
    name: Shared staging onboarding
    needs: smoke
    if: ${{ always() && (inputs.suite == 'all' || inputs.suite == 'cloud') }}
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # The runner contract uses ELIZAOS_CLOUD_API_KEY; ELIZACLOUD_API_KEY is
      # the repository's established staging smoke credential.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
      CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH: reports/live-smoke/shared-staging-onboarding.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Require isolated staging credential
        shell: bash
        run: |
          set -euo pipefail
          key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          key_without_whitespace="${key_without_whitespace//[[:space:]]/}"
          if [[ -z "$key_without_whitespace" ]]; then
            echo "::error::Shared staging onboarding requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing a green skip."
            exit 1
          fi
          unset key_without_whitespace

      - name: Run shared staging onboarding smoke
        run: bun run cloud:shared-onboarding:live

      - name: Upload privacy-safe shared staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-staging-onboarding
          path: reports/live-smoke/shared-staging-onboarding.json
          if-no-files-found: error
          retention-days: 7
